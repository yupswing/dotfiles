# Generato da pywal: non modificare a mano (template in ~/.config/wal/templates).
# Caricato da dunst come drop-in: ~/.config/dunst/dunstrc.d/50-wal.conf e' un
# link a questo file. Stessi ruoli di colors.rasi (rofi).
[global]
    frame_color = "{color5}"

[urgency_low]
    frame_color = "{color5}"
    highlight = "{color5}"

[urgency_normal]
    frame_color = "{color5}"
    foreground = "{foreground}"
    highlight = "{color5}"

[urgency_critical]
    frame_color = "{color1}"
    foreground = "{foreground}"
    highlight = "{color1}"
