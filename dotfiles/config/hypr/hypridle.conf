# Doc: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

# Spegne gli schermi dopo 15 minuti di inattività e li riaccende alla prima
# attività (mouse compreso). Con la config Lua la sintassi classica
# `hyprctl dispatch dpms off` non è valida: serve passare codice Lua.
listener {
    timeout = 900
    on-timeout = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "disable" }))'
    on-resume = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "enable" }))'
}
