# Doc: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
# Con la config Lua la sintassi classica `hyprctl dispatch dpms off` non è
# valida: serve passare codice Lua con `hyprctl eval`.

# 2 minuti: blocca la sessione (mette in pausa musica e notifiche)
listener {
    timeout = 120
    on-timeout = ~/.scripts/wayland-lock.zsh
}

# 10 minuti: spegne gli schermi, li riaccende alla prima attività (mouse compreso)
listener {
    timeout = 600
    on-timeout = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "disable" }))'
    on-resume = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "enable" }))'
}
