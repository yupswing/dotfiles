# Doc: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
# {{@@ header() @@}}

# Colori di default, usati solo se pywal non ha ancora generato i suoi
$wal_background = rgb(333333)
$wal_background_alpha = rgba(333333cc)
$wal_foreground = rgb(eeeeee)
$wal_primary = rgb(8888ff)
$wal_secondary = rgb(88cc88)
$wal_warning = rgb(ddbb66)
$wal_danger = rgb(dd6666)

# Colori pywal (template in ~/.config/wal/templates/hyprlock.conf)
source = ~/.cache/wal/hyprlock.conf

$font = SF Pro Text

general {
  hide_cursor = true
  ignore_empty_input = true
  # 1 = screenshot via CPU: con Intel+NVIDIA quello via GPU (0) fallisce e
  # hyprlock aspetta 2s di timeout prima di bloccare
  screencopy_mode = 1
}

# Sfondo: screenshot sfocato del monitor (monitor vuoto = tutti)
background {
  monitor =
  path = screenshot
  color = $wal_background
  blur_passes = 3
  blur_size = 3
  brightness = 0.6
}

# Ora
label {
  monitor =
  text = $TIME
  color = $wal_foreground
  font_size = 96
  font_family = $font
  position = 0, 160
  halign = center
  valign = center
}

# Data
label {
  monitor =
  text = cmd[update:60000] date +"%A %d %B"
  color = $wal_primary
  font_size = 20
  font_family = $font
  position = 0, 50
  halign = center
  valign = center
}

input-field {
  monitor =
  size = 360, 60
  position = 0, -60
  halign = center
  valign = center

  rounding = {{@@ ROUNDED @@}}
  outline_thickness = 3
  outer_color = $wal_primary
  inner_color = $wal_background_alpha
  font_color = $wal_foreground
  font_family = $font

  check_color = $wal_secondary
  fail_color = $wal_danger
  capslock_color = $wal_warning

  dots_size = 0.25
  dots_spacing = 0.3
  dots_center = true

  fade_on_empty = false
  placeholder_text =
  fail_text = <i>$FAIL ($ATTEMPTS)</i>
}
