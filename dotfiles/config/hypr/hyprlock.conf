# Doc: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
# {{@@ header() @@}}

# Colori di default, usati solo se pywal non ha ancora generato i suoi
$wal_background = rgb(333333)
$wal_foreground = rgb(eeeeee)
$wal_primary = rgb(8888ff)
$wal_secondary = rgb(88cc88)
$wal_warning = rgb(ddbb66)
$wal_danger = rgb(dd6666)

# Colori pywal (template in ~/.config/wal/templates/hyprlock.conf)
source = ~/.cache/wal/hyprlock.conf

$font = SF Pro Display
$white = rgb(ffffff)

# Ombra scura dietro alle scritte (ora e data), per leggerle anche su sfondi
# chiari: passes = quanto è sfumata (0 = niente ombra), size = quanto si
# allarga, boost = quanto è intensa.
# size va in proporzione al carattere: la stessa sfumatura che su cifre spesse
# resta scura, su lettere sottili si disperde e quasi sparisce. Con le cifre a
# 120 e i testi a 20-28 il rapporto è circa 6 a 1
$shadow_passes = 2
$shadow_size_big = 6
$shadow_size_small = 1
$shadow_color = rgb(000000)
$shadow_boost = 0.8

general {
  hide_cursor = true
  ignore_empty_input = true
  # 1 = screenshot via CPU: con Intel+NVIDIA quello via GPU (0) fallisce e
  # hyprlock aspetta 2s di timeout prima di bloccare
  screencopy_mode = 1
}

# Sfondo: lo sfondo del desktop
background {
  monitor =
  path = {{@@ WALLPAPER @@}}
  color = $wal_background
}

# Alternativa: screenshot sfocato
# background {
#   monitor =
#   path = screenshot
#   color = $wal_background
#   blur_passes = 3
#   blur_size = 3
#   brightness = 0.6
# }

# Blocco centrale, una label per riga

# Ore
label {
  monitor =
  text = cmd[update:1000] date +"%H"
  color = $white
  font_size = 120
  font_family = $font
  shadow_passes = $shadow_passes
  shadow_size = $shadow_size_big
  shadow_color = $shadow_color
  shadow_boost = $shadow_boost
  position = 0, 240
  halign = center
  valign = center
}

# Minuti
label {
  monitor =
  text = cmd[update:1000] date +"%M"
  color = $white
  font_size = 120
  font_family = $font
  shadow_passes = $shadow_passes
  shadow_size = $shadow_size_big
  shadow_color = $shadow_color
  shadow_boost = $shadow_boost
  position = 0, 110
  halign = center
  valign = center
}

# Giorno della settimana
label {
  monitor =
  text = cmd[update:60000] date +"%A"
  color = $white
  font_size = 28
  font_family = $font
  shadow_passes = $shadow_passes
  shadow_size = $shadow_size_small
  shadow_color = $shadow_color
  shadow_boost = $shadow_boost
  position = 0, 10
  halign = center
  valign = center
}

# Giorno e mese
label {
  monitor =
  text = cmd[update:60000] date +"%-d %B"
  color = $white
  font_size = 20
  font_family = $font
  shadow_passes = $shadow_passes
  shadow_size = $shadow_size_small
  shadow_color = $shadow_color
  shadow_boost = $shadow_boost
  position = 0, -25
  halign = center
  valign = center
}

input-field {
  monitor =
  size = 360, 60
  position = 0, 10% # dal fondo dello schermo
  halign = center
  valign = bottom

  rounding = -1 # arrotondamento completo (pill)
  outline_thickness = 3
  outer_color = rgba(eeeeee66)
  inner_color = rgba(cccccc33)
  font_color = $wal_foreground
  font_family = $font

  check_color = $wal_secondary
  fail_color = $wal_danger
  capslock_color = $wal_warning

  dots_size = 0.25
  dots_spacing = 0.3
  dots_center = true

  fade_on_empty = false
  placeholder_text =
  fail_text = <i>$FAIL ($ATTEMPTS)</i>
}
