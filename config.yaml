config:
  backup: true
  create: true
  dotpath: dotfiles
  force_chmod: true
  cmpignore:
  - '*/README.md'
  upignore:
  - '*/README.md'
  instignore:
  - '*/README.md'

# ========================================================================== #
# ========================================================================== #

  minversion: 1.14.0
variables:
  HOME_HOST: FoxPC
  WORK_HOST: FoxDotPc
  VM_HOST: FoxVmArch
  DEFAULT_BROWSER: firefox
  DEFAULT_FILE_MANAGER: nemo
  WM: bspwm
  ROUNDED: 14
  # waybar: THEME_PRIMARY must match color5 of the wal colorscheme
  THEME_PRIMARY: '#9358fe'
  THEME_SECONDARY: '#f19d3a'
  # desktop wallpaper (hyprpaper), also the hyprlock background
  WALLPAPER: ~/Pictures/backgrounds/topos.jpg
actions:
  wal: wal -R
  # dunst cannot import files: the pywal colors are a drop-in linked from the cache
  dunst_wal: mkdir -p ~/.config/dunst/dunstrc.d && ln -sf ~/.cache/wal/dunst.conf ~/.config/dunst/dunstrc.d/50-wal.conf
  ssh_permissions: find ~/.ssh -type f -name '*' -exec chmod 600 {{}} \;
dotfiles:
  bin:
    src: bin
    dst: ~/.bin
    link: link_children
  scripts:
    src: scripts
    dst: ~/.scripts
  locale:
    src: config/locale.conf
    dst: ~/.config/locale.conf
  ssh_config:
    src: ssh/config
    dst: ~/.ssh/config
  ssh_simonecingano:
    src: ssh/simonecingano.gpg
    dst: ~/.ssh/simonecingano
    trans_install: gpg
  ssh_simonecingano_pub:
    src: ssh/simonecingano.pub
    dst: ~/.ssh/simonecingano.pub
  ssh_dotvocal:
    src: ssh/dotvocal.gpg
    dst: ~/.ssh/dotvocal
    trans_install: gpg
  ssh_dotvocal_pub:
    src: ssh/dotvocal.pub
    dst: ~/.ssh/dotvocal.pub
  bash_profile:
    src: bash_profile.sh
    dst: ~/.bash_profile
  zshlib:
    src: zsh/zshlib
    dst: ~/.zshlib
    upignore:
    - zplug
    cmpignore:
    - zplug
  zshenv:
    src: zsh/zshenv.zsh
    dst: ~/.zshenv
  zshrc:
    src: zsh/zshrc.zsh
    dst: ~/.zshrc
  nvim:
    src: config/nvim
    dst: ~/.config/nvim
  ruby:
    src: ruby
    dst: ~/
  rubocop:
    src: rubocop.yml
    dst: ~/.rubocop.yml
  pryrc:
    src: pryrc
    dst: ~/.pryrc
  btop:
    src: config/btop
    dst: ~/.config/btop
  bat:
    src: config/bat
    dst: ~/.config/bat
  gtkrc-2.0:
    src: gtkrc-2.0
    dst: ~/.gtkrc-2.0
  gtk-3.0:
    src: config/gtk-3.0
    dst: ~/.config/gtk-3.0
  dconf:
    src: config/dconf
    dst: ~/.config/dconf
  mimeapps.list:
    src: config/mimeapps.list
    dst: ~/.config/mimeapps.list
  kitty:
    src: config/kitty
    dst: ~/.config/kitty
  autostart:
    src: config/autostart.sh
    dst: ~/.config/autostart.sh
  hypr:
    src: config/hypr
    dst: ~/.config/hypr
  desktop-portal:
    src: config/xdg-desktop-portal
    dst: ~/.config/xdg-desktop-portal
  polybar:
    src: config/polybar
    dst: ~/.config/polybar
  waybar:
    src: config/waybar
    dst: ~/.config/waybar
  cliphist:
    src: config/cliphist
    dst: ~/.config/cliphist
  spotify-flags:
    src: config/spotify-flags.conf
    dst: ~/.config/spotify-flags.conf
  rofi:
    src: config/rofi
    dst: ~/.config/rofi
  wal:
    src: config/wal
    dst: ~/.config/wal
    actions:
    - wal
  dunst:
    src: config/dunst
    dst: ~/.config/dunst
    actions:
    - dunst_wal
  gsimplecal:
    src: config/gsimplecal
    dst: ~/.config/gsimplecal
  fontconfig:
    src: config/fontconfig
    dst: ~/.config/fontconfig
  dir_colors:
    src: dir_colors
    dst: ~/.dir_colors
  gitconfig:
    src: gitconfig
    dst: ~/.gitconfig
  backgrounds:
    src: data/backgrounds
    dst: ~/Pictures/backgrounds
  assets:
    src: data/assets
    dst: ~/.assets
profiles:
  ssh:
    dotfiles:
    - ssh_config
    - ssh_simonecingano
    - ssh_simonecingano_pub
    - ssh_dotvocal
    - ssh_dotvocal_pub
    actions:
    - ssh_permissions

  base_line:
    include:
    - zsh
    - bash
    dotfiles:
    - locale
    - ruby
    - btop
    - nvim
    - bin
    - scripts
    - dir_colors
    - gitconfig
    - bat
    - assets

  base_gui:
    dotfiles:
    - gtkrc-2.0
    - gtk-3.0
    - dconf
    - mimeapps.list
    - fontconfig
    - kitty
    - backgrounds
    - autostart

  # Groups ===================================================================

  bash:
    dotfiles:
    - bash_profile

  zsh:
    dotfiles:
    - zshlib
    - zshenv
    - zshrc

  hypr:
    dotfiles:
    - hypr
    - desktop-portal
    - wal
    - dunst
    - rofi
    - waybar
    - cliphist
    - spotify-flags

  wsl:
    include:
    - base_line

  # Hosts ====================================================================

  FoxPc:
    include:
    - ssh
    - base_line

  FoxVmArch:
    include:
    - ssh
    - base_line
    - base_gui
    - hypr
    variables:
      DEFAULT_BROWSER: google-chrome
  FoxDotPc:
    include:
    - ssh
    - base_line
    - base_gui
    - hypr
    variables:
      DEFAULT_BROWSER: google-chrome
trans_install:
  gpg: gpg2 -q --for-your-eyes-only --no-tty -d {0} > {1}
